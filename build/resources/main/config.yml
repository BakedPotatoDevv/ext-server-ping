# Minecraft server settings
server-ip: example.com # like play.minekeep.net, the server this plugin was for
server-port: 25565     # the server's port
update-interval: 30    # in seconds
debug: false           # optional debugging

# Discord integration (optional)
discord-token: ""      # your bot token here
discord-guild-id: 0    # server id here
discord-channel-id: 0  # the ID of the channel to post status
discord-message-id: 0  # optional: specific message to update (0 = create new)
